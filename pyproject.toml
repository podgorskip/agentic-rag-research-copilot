[project]
name = "agentic-rag-copilot"
version = "0.1.0"
description = "Autonomous multi-source Q&A agent over research papers with a self-correcting agentic loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.380",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag_copilot"]

# Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH", "ANN", "PTH", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_rag_copilot"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80"

[tool.coverage.run]
source = ["."]
relative_files = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pyright]
typeCheckingMode = "strict"
# Allow 'Any' in dictionaries where we don't know the exact schema of external metadata
reportUnknownArgumentType = false
reportUnknownMemberType = false
