sonar.organization=podgorskip
sonar.projectKey=podgorskip_agentic-rag-research-copilot
sonar.projectName=agentic-rag-copilot

# Source code and test locations
sonar.sources=src
sonar.tests=tests

# Python configuration and coverage report path
sonar.python.version=3.12
sonar.python.coverage.reportPaths=.cache/coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**, .venv/**, tests/**
sonar.test.inclusions=tests/**
